<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Yeswood brand fallback</title>
  <desc id="desc">A calm source image for Yeswood recommendations when a verified product photo is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5efe5"/>
      <stop offset="1" stop-color="#d9c7ad"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8a5b35"/>
      <stop offset="1" stop-color="#c69a67"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect x="0" y="370" width="1200" height="150" fill="#c5a784" opacity=".45"/>
  <g transform="translate(178 130)">
    <rect x="0" y="118" width="390" height="34" rx="17" fill="url(#wood)"/>
    <rect x="42" y="152" width="24" height="138" rx="12" fill="#7d5738"/>
    <rect x="324" y="152" width="24" height="138" rx="12" fill="#7d5738"/>
    <rect x="52" y="174" width="286" height="14" rx="7" fill="#9f724a" opacity=".7"/>
    <path d="M34 128c70-36 141-54 214-54 62 0 113 12 153 37" fill="none" stroke="#7f5637" stroke-width="13" stroke-linecap="round" opacity=".45"/>
  </g>
  <g fill="#6b4a32" transform="translate(650 160)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="1">YESWOOD</text>
    <text x="0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600">源氏木语</text>
    <rect x="0" y="96" width="310" height="2" fill="#8f6a49" opacity=".45"/>
    <text x="0" y="146" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#806148">实木家具品牌兜底图</text>
  </g>
</svg>
